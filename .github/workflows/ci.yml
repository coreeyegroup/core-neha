name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Maven version
        run: mvn -v
      - name: Build and test
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: OpenAPI contract matches contracts/openapi.json
        run: |
          python3 -m json.tool --sort-keys backend/target/openapi.json > /tmp/exported.json
          if [ -f contracts/openapi.json ] && diff -q /tmp/exported.json contracts/openapi.json > /dev/null; then
            echo "contract unchanged"
          else
            echo "::warning::contracts/openapi.json differs from the exported contract; update it and regenerate the client"
            echo "OPENAPI-CONTRACT-BEGIN"; python3 -c "import json;print(json.dumps(json.load(open('/tmp/exported.json')),sort_keys=True))"; echo "OPENAPI-CONTRACT-END"
          fi
      - name: OpenAPI contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: backend/target/openapi.json
          retention-days: 30
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  deploy-files:
    name: Deployment files check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Shell scripts (errors only)
        run: shellcheck -S error ops/*.sh ops/cn deploy/postgres/*.sh deploy/postgres/initdb/*.sh deploy/keycloak/core-neha/*.sh backend/docker/*.sh
      - name: Compose file renders
        run: |
          mkdir -p /tmp/secrets
          CORE_NEHA_SECRETS_DIR=/tmp/secrets docker compose -f deploy/compose.yaml --env-file deploy/config/core-neha.env.example config -q
      - name: Realm file is valid JSON
        run: python3 -m json.tool deploy/keycloak/realm/core-neha-realm.json > /dev/null
