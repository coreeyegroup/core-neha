name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Maven version
        run: mvn -v
      - name: Build and test
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: OpenAPI contract matches contracts/openapi.json
        run: |
          python3 -m json.tool --sort-keys backend/target/openapi.json > /tmp/exported.json
          if [ -f contracts/openapi.json ] && python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/exported.json')) == json.load(open('contracts/openapi.json')) else 1)"; then
            echo "contract unchanged"
          else
            echo "::error::contracts/openapi.json differs from the exported contract; update it and regenerate the client"
            echo "OPENAPI-CONTRACT-BEGIN"; python3 -c "import json;print(json.dumps(json.load(open('/tmp/exported.json')),sort_keys=True,indent=1))"; echo "OPENAPI-CONTRACT-END"
            exit 1
          fi
      - name: OpenAPI contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: backend/target/openapi.json
          retention-days: 30
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend:
    name: Staff application build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API client matches the contract
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated || { echo "::error::Run npm run generate:api and commit the result"; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser workflow tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  deploy-files:
    name: Deployment files check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Shell scripts (errors only)
        run: shellcheck -S error ops/*.sh ops/cn deploy/postgres/*.sh deploy/postgres/initdb/*.sh deploy/keycloak/core-neha/*.sh backend/docker/*.sh
      - name: Compose file renders
        run: |
          mkdir -p /tmp/secrets
          CORE_NEHA_SECRETS_DIR=/tmp/secrets docker compose -f deploy/compose.yaml --env-file deploy/config/core-neha.env.example config -q
      - name: Realm file is valid JSON
        run: python3 -m json.tool deploy/keycloak/realm/core-neha-realm.json > /dev/null
