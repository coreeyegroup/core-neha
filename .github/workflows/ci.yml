name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Maven version
        run: mvn -v
      - name: Build and test
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  deploy-files:
    name: Deployment files check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts (errors only)
        run: shellcheck -S error ops/*.sh ops/cn deploy/postgres/*.sh deploy/postgres/initdb/*.sh deploy/keycloak/core-neha/*.sh backend/docker/*.sh
      - name: Compose file renders
        run: |
          mkdir -p /tmp/secrets
          CORE_NEHA_SECRETS_DIR=/tmp/secrets docker compose -f deploy/compose.yaml --env-file deploy/config/core-neha.env.example config -q
      - name: Realm file is valid JSON
        run: python3 -m json.tool deploy/keycloak/realm/core-neha-realm.json > /dev/null
