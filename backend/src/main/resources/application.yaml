# core-neha backend configuration. Secrets come from files in /run/secrets
# (Docker Compose secrets) through the config tree import; file names become
# property names. Nothing secret is written here or in the environment.
spring:
  application:
    name: core-neha
  config:
    import: "optional:configtree:/run/secrets/"
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${CORE_NEHA_DB_HOST:postgres}:5432/core_neha
    username: core_neha_app
    password: ${core_neha_app_password}
    hikari:
      maximum-pool-size: 20
      pool-name: core-neha-app
  flyway:
    # Migrations run as the owner role; the application runs as core_neha_app (ADR-0007).
    url: ${spring.datasource.url}
    user: core_neha_owner
    password: ${core_neha_owner_password}
    locations: classpath:db/migration
    validate-migration-naming: true
  session:
    timeout: 30m
    jdbc:
      table-name: session.spring_session
      initialize-schema: never
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: core-neha-staff
            client-secret: ${oidc_staff_client_secret:}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            # Browser-facing endpoint on the public address; server-to-server endpoints on the internal network.
            authorization-uri: ${core-neha.identity.public-url}/realms/core-neha/protocol/openid-connect/auth
            token-uri: ${core-neha.identity.internal-url}/realms/core-neha/protocol/openid-connect/token
            jwk-set-uri: ${core-neha.identity.internal-url}/realms/core-neha/protocol/openid-connect/certs
            user-info-uri: ${core-neha.identity.internal-url}/realms/core-neha/protocol/openid-connect/userinfo
            user-name-attribute: sub

server:
  port: 8080
  servlet:
    context-path: ${CORE_NEHA_BASE_PATH:/core-neha}/api
    session:
      cookie:
        name: CORE_NEHA_SESSION
        http-only: true
        secure: true
        same-site: lax
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

core-neha:
  environment: ${CORE_NEHA_ENVIRONMENT:dev}
  public-base-url: ${CORE_NEHA_PUBLIC_BASE_URL:http://localhost:18400/core-neha}
  base-path: ${CORE_NEHA_BASE_PATH:/core-neha}
  identity:
    realm: core-neha
    internal-url: http://${CORE_NEHA_KEYCLOAK_HOST:keycloak}:8080${CORE_NEHA_BASE_PATH:/core-neha}/auth
    public-url: ${CORE_NEHA_PUBLIC_BASE_URL:http://localhost:18400/core-neha}/auth
    staff-client-id: core-neha-staff
    provisioner-client-id: core-neha-provisioner
    provisioner-client-secret: ${oidc_provisioner_client_secret:}
  session:
    absolute-timeout: 12h
  operations:
    command: ${CORE_NEHA_COMMAND:}
    output-dir: ${CORE_NEHA_OUTPUT_DIR:/out}
