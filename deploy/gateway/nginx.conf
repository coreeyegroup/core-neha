# core-neha gateway. Site routes are rendered from templates/ at start
# (only variables present in the environment are substituted).
worker_processes 2;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;
  client_max_body_size 20m;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Values set by the public proxy (Caddy); local requests fall back to own values.
  map $http_x_forwarded_proto $xf_proto { default $http_x_forwarded_proto; "" $scheme; }
  map $http_x_forwarded_host  $xf_host  { default $http_x_forwarded_host;  "" $http_host; }
  map $xf_proto $xf_port { https 443; default 80; }

  # Path only (no query string), so tokens or codes in URLs are never logged.
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"client":"$remote_addr","forwarded_for":"$http_x_forwarded_for","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status"}';
  access_log /dev/stdout json;

  include /etc/nginx/conf.d/*.conf;
}
