<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>core-neha – installation in progress</title>
  <style>
    :root { color-scheme: light dark; --fg:#1b1f24; --muted:#57606a; --bg:#f6f8fa; --card:#fff; --line:#d0d7de; --accent:#0b5cad; }
    @media (prefers-color-scheme: dark) { :root { --fg:#e6edf3; --muted:#9da7b3; --bg:#0d1117; --card:#161b22; --line:#30363d; --accent:#6cb6ff; } }
    body { margin:0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width: 640px; margin: 10vh auto; padding: 0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .tag { display:inline-block; font-size:13px; font-weight:600; color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:1px 8px; margin-bottom:12px; }
    p { margin: 8px 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <span class="tag">Demonstration environment</span>
      <h1>core-neha is being installed</h1>
      <p>The staff application is not deployed yet. Identity and database services are running; the organisation and access foundation (slice 1.1) follows.</p>
      <p>Do not enter real patient or staff data in this environment.</p>
    </div>
  </main>
</body>
</html>
